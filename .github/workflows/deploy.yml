name: Build and Deploy Cal.com
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=8192
      NEXT_PUBLIC_WEBAPP_URL: https://vocallink.co.za
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy" 
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder_secret_for_build' }}
      CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY || 'placeholder_key_for_build' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Dependencies & Generate Prisma
        run: |
          corepack enable
          yarn install --no-immutable
          yarn workspace @calcom/prisma prisma generate
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Build Cal.com
        run: yarn build

      - name: Package Build Artifacts
        run: |
          # Grabbing exactly what is needed for the monorepo to run on the VPS
          tar -czf calcom-build.tar.gz \
            apps/web/.next/ \
            apps/web/public/ \
            apps/web/next.config.js \
            apps/web/package.json \
            package.json \
            yarn.lock \
            .yarnrc.yml \
            packages/prisma/schema.prisma

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "calcom-build.tar.gz"
          target: "/home/deploy/cal.com/"

      - name: Extract and Restart App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/cal.com
            tar -xzf calcom-build.tar.gz
            rm calcom-build.tar.gz
            
            corepack enable
            # Focus only on production dependencies for the web workspace
            yarn workspaces focus @calcom/web --production
            
            # Restart with PM2
            # We use 'yarn workspace @calcom/web start' to ensure monorepo paths are respected
            pm2 restart calcom || pm2 start "yarn workspace @calcom/web start" --name calcom
            pm2 save
