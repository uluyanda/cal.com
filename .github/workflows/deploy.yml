name: Build and Deploy Cal.com
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=8192
      NEXT_PUBLIC_WEBAPP_URL: https://vocallink.co.za
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy" 
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder_secret_for_build' }}
      CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY || 'placeholder_key_for_build' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          corepack enable
          yarn config set nodeLinker node-modules
          yarn install --no-immutable
        env:
          YARN_ENABLE_SCRIPTS: false
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Generate Prisma Client
        run: |
          yarn workspace @calcom/prisma prisma generate
          
          # 1. Ensure the root has it (where the error log is pointing)
          mkdir -p node_modules/.prisma/client
          cp -R packages/prisma/node_modules/.prisma/client/* node_modules/.prisma/client/ || true
          
          # 2. Ensure the Web app has it locally
          mkdir -p apps/web/node_modules/.prisma/client
          cp -R packages/prisma/node_modules/.prisma/client/* apps/web/node_modules/.prisma/client/ || true
          
          # 3. Double check the specific prisma client package location
          mkdir -p node_modules/@prisma/client
          cp -R packages/prisma/node_modules/@prisma/client/* node_modules/@prisma/client/ || true
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Build Cal.com
        run: yarn build
        env:
          # Keep these to bypass the TypeScript errors from your earlier logs
          NEXTJS_IGNORE_TYPECHECK: true
          NEXTJS_IGNORE_ESLINT: true
          # Force the workaround plugin to look at the root node_modules
          PRISMA_CLIENT_PATH: "../../node_modules/.prisma/client"
          NEXT__MONOREPO_WORKAROUND_PRISMA_PATH: "../../node_modules/.prisma/client"

      - name: Package Build Artifacts
        run: |
          tar -czf calcom-build.tar.gz \
            apps/web/.next/ \
            apps/web/public/ \
            apps/web/next.config.js \
            apps/web/package.json \
            package.json \
            yarn.lock \
            .yarnrc.yml \
            packages/prisma/schema.prisma \
            packages/prisma/package.json

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "calcom-build.tar.gz"
          target: "/home/deploy/cal.com/"

      - name: Extract and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/cal.com
            tar -xzf calcom-build.tar.gz
            rm calcom-build.tar.gz
            corepack enable
            # Focus only on the production workspace
            yarn workspaces focus @calcom/web --production
            pm2 restart calcom || pm2 start "yarn workspace @calcom/web start" --name calcom
            pm2 save
