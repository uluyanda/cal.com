name: Build and Deploy Cal.com
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=8192
      NEXT_PUBLIC_WEBAPP_URL: https://vocallink.co.za
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy" 
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder_secret_for_build' }}
      CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY || 'placeholder_key_for_build' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          corepack enable
          # Step 1: Install ONLY. Do not run post-install scripts yet.
          # This prevents the circular "doesn't seem to have been installed" error.
          yarn install --no-immutable
        env:
          YARN_ENABLE_SCRIPTS: false 
          YARN_NODE_LINKER: node-modules

      - name: Generate Prisma Client
        # Step 2: Now that files are on disk, we run Prisma specifically.
        run: yarn workspace @calcom/prisma prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Build Cal.com
        # Step 3: Run the full build. 
        # We add a flag to skip the automatic 'install' check that Turbo does.
        run: yarn build

      - name: Build Cal.com
        run: yarn build

      - name: Package Build Artifacts
        run: |
          tar -czf calcom-build.tar.gz \
            apps/web/.next/ \
            apps/web/public/ \
            apps/web/next.config.js \
            apps/web/package.json \
            package.json \
            yarn.lock \
            .yarnrc.yml \
            packages/prisma/schema.prisma \
            packages/prisma/package.json

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "calcom-build.tar.gz"
          target: "/home/deploy/cal.com/"

      - name: Extract and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/cal.com
            tar -xzf calcom-build.tar.gz
            rm calcom-build.tar.gz
            corepack enable
            # Focus only on the production workspace
            yarn workspaces focus @calcom/web --production
            pm2 restart calcom || pm2 start "yarn workspace @calcom/web start" --name calcom
            pm2 save
