name: Build and Deploy Cal.com
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=8192
      # Required for Next.js build
      NEXT_PUBLIC_WEBAPP_URL: https://vocallink.co.za
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy 
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder_secret_for_build' }}
      CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY || 'placeholder_key_for_build' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies 
        run: |
          corepack enable
          yarn install --immutable

      - name: Build Cal.com
        run: yarn build

      - name: Package Build Artifacts
        run: |
          # Package only what is needed for production runtime
          tar -czf calcom-build.tar.gz \
            .next/ \
            public/ \
            package.json \
            yarn.lock \
            .yarnrc.yml \
            next.config.mjs

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "calcom-build.tar.gz"
          target: "/home/deploy/cal.com/"

      - name: Extract and Restart App
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/cal.com
            tar -xzf calcom-build.tar.gz
            rm calcom-build.tar.gz
            
            # Ensure production env vars are loaded on the VPS
            # Assuming you have a .env file already at /home/deploy/cal.com/.env
            
            corepack enable
            yarn install --production
            
            # Use PM2 to manage the process
            pm2 restart calcom || pm2 start "yarn start" --name calcom
            pm2 save
