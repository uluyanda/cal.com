name: Build and Deploy Cal.com
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=8192
      NEXT_PUBLIC_WEBAPP_URL: https://vocallink.co.za
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy" 
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder_secret_for_build' }}
      CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY || 'placeholder_key_for_build' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          corepack enable
          yarn config set nodeLinker node-modules
          yarn install --no-immutable
        env:
          YARN_ENABLE_SCRIPTS: false
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Generate Prisma Client
        run: |
          # 1. Run generation
          yarn workspace @calcom/prisma prisma generate
          
          # 2. We must put the client in the ROOT node_modules for the workaround plugin to find it
          # Based on your previous log, the source is: packages/prisma/generated/prisma
          mkdir -p node_modules/.prisma/client
          cp -R packages/prisma/generated/prisma/* node_modules/.prisma/client/
          
          # 3. Create a secondary link just in case
          mkdir -p node_modules/@prisma/client
          cp -R packages/prisma/generated/prisma/* node_modules/@prisma/client/
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Build Cal.com
        run: yarn build
        env:
          # These ignore the TS decorator errors you see in the logs
          NEXTJS_IGNORE_TYPECHECK: true
          NEXTJS_IGNORE_ESLINT: true
          # The workaround plugin looks for this variable specifically
          # We point it to the root node_modules relative to apps/web
          NEXT_MONOREPO_WORKAROUND_PRISMA_PATH: "../../node_modules/.prisma/client"
          # Standard Prisma envs
          PRISMA_CLIENT_PATH: "../../node_modules/.prisma/client"
          TURBO_SKIP_NODE_MODULES_CHECK: true

      - name: Package Build Artifacts
        run: |
          tar -czf calcom-build.tar.gz \
            apps/web/.next/ \
            apps/web/public/ \
            apps/web/next.config.js \
            apps/web/package.json \
            package.json \
            yarn.lock \
            .yarnrc.yml \
            packages/prisma/schema.prisma \
            packages/prisma/package.json

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "calcom-build.tar.gz"
          target: "/home/deploy/cal.com/"

      - name: Extract and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/cal.com
            tar -xzf calcom-build.tar.gz
            rm calcom-build.tar.gz
            corepack enable
            # Focus only on the production workspace
            yarn workspaces focus @calcom/web --production
            pm2 restart calcom || pm2 start "yarn workspace @calcom/web start" --name calcom
            pm2 save
