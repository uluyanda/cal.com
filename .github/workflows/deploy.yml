name: Build and Deploy Cal.com
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=8192
      NEXT_PUBLIC_WEBAPP_URL: https://vocallink.co.za
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy" 
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder_secret_for_build' }}
      CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY || 'placeholder_key_for_build' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          corepack enable
          yarn config set nodeLinker node-modules
          yarn install --no-immutable
        env:
          YARN_ENABLE_SCRIPTS: false
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Generate Prisma Client
        run: |
          # 1. Generate the client
          yarn workspace @calcom/prisma prisma generate
          
          # 2. Define the source path
          PRISMA_SRC="packages/prisma/generated/prisma"
          
          # 3. Force copy into every location the monorepo plugin might check:
          # Root node_modules
          mkdir -p node_modules/.prisma/client
          cp -vR $PRISMA_SRC/* node_modules/.prisma/client/
          
          # App-specific node_modules (Crucial for the Webpack plugin)
          mkdir -p apps/web/node_modules/.prisma/client
          cp -vR $PRISMA_SRC/* apps/web/node_modules/.prisma/client/
          
          # Standard @prisma/client location
          mkdir -p node_modules/@prisma/client
          cp -vR $PRISMA_SRC/* node_modules/@prisma/client/

          # 4. Debug check: Does the file actually exist where the error says?
          ls -l apps/web/node_modules/.prisma/client/index.js
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Build Cal.com
        run: yarn build
        env:
          NEXTJS_IGNORE_TYPECHECK: true
          NEXTJS_IGNORE_ESLINT: true
          # We provide the path relative to apps/web/
          NEXT_MONOREPO_WORKAROUND_PRISMA_PATH: "./node_modules/.prisma/client"
          PRISMA_CLIENT_PATH: "./node_modules/.prisma/client"

      - name: Package Build Artifacts
        run: |
          tar -czf calcom-build.tar.gz \
            apps/web/.next/ \
            apps/web/public/ \
            apps/web/next.config.js \
            apps/web/package.json \
            node_modules/.prisma/ \
            package.json \
            yarn.lock \
            .yarnrc.yml \
            packages/prisma/schema.prisma \
            packages/prisma/package.json

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "calcom-build.tar.gz"
          target: "/home/deploy/cal.com/"

      - name: Extract and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/cal.com
            tar -xzf calcom-build.tar.gz
            rm calcom-build.tar.gz
            corepack enable
            yarn config set nodeLinker node-modules
            yarn workspaces focus @calcom/web --production
            pm2 restart calcom || pm2 start "yarn workspace @calcom/web start" --name calcom
            pm2 save
