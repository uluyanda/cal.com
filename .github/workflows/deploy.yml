name: Build and Deploy Cal.com
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=8192
      NEXT_PUBLIC_WEBAPP_URL: https://vocallink.co.za
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy" 
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'placeholder_secret_for_build' }}
      CALENDSO_ENCRYPTION_KEY: ${{ secrets.CALENDSO_ENCRYPTION_KEY || 'placeholder_key_for_build' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          corepack enable
          yarn config set nodeLinker node-modules
          yarn install --no-immutable
        env:
          YARN_ENABLE_SCRIPTS: false
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

       - name: Generate Prisma Client
        run: |
          # 1. Generate into the default location
          yarn workspace @calcom/prisma prisma generate
          
          # 2. PHYSICALLY move the generated client to the root node_modules. 
          # The plugin is crashing because it expects it here:
          mkdir -p node_modules/.prisma/client
          cp -vR packages/prisma/generated/prisma/* node_modules/.prisma/client/
          
          # 3. Also place it in the @prisma/client package directory
          mkdir -p node_modules/@prisma/client
          cp -vR packages/prisma/generated/prisma/* node_modules/@prisma/client/

          # 4. Verify for the logs (helps us debug if it fails again)
          ls -R node_modules/.prisma/client | head -n 10
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Build Cal.com
        run: yarn build
        env:
          NEXTJS_IGNORE_TYPECHECK: true
          NEXTJS_IGNORE_ESLINT: true
          # We tell the workaround plugin to look specifically at the root
          NEXT_MONOREPO_WORKAROUND_PRISMA_PATH: "../../node_modules/.prisma/client"
          PRISMA_CLIENT_PATH: "../../node_modules/.prisma/client"


/////////
      - name: Generate Prisma Client
        run: |
          # 1. Run the generation
          yarn workspace @calcom/prisma prisma generate
          
          # 2. Link the generated client into the locations expected by the monorepo
          mkdir -p node_modules/.prisma
          ln -sfn $(pwd)/packages/prisma/generated/prisma node_modules/.prisma/client
          
          mkdir -p apps/web/node_modules/.prisma
          ln -sfn $(pwd)/packages/prisma/generated/prisma apps/web/node_modules/.prisma/client
          
          mkdir -p node_modules/@prisma
          ln -sfn $(pwd)/packages/prisma/generated/prisma node_modules/@prisma/client
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Build Cal.com
        run: yarn build
        env:
          NEXTJS_IGNORE_TYPECHECK: true
          NEXTJS_IGNORE_ESLINT: true
          # We point these to the ABSOLUTE path so the Webpack plugin doesn't get lost
          NEXT_MONOREPO_WORKAROUND_PRISMA_PATH: "/home/runner/work/cal.com/cal.com/node_modules/.prisma/client"
          PRISMA_CLIENT_PATH: "/home/runner/work/cal.com/cal.com/node_modules/.prisma/client"
          # This helps ignore those decorator TS1240 errors during the build phase
          TS_NODE_TRANSPILE_ONLY: "true" 
          NODE_OPTIONS: "--max_old_space_size=8192"

      - name: Package Build Artifacts
        run: |
          # We MUST include the generated prisma client in the tarball
          tar -czf calcom-build.tar.gz \
            apps/web/.next/ \
            apps/web/public/ \
            apps/web/next.config.js \
            apps/web/package.json \
            node_modules/.prisma/ \
            package.json \
            yarn.lock \
            .yarnrc.yml \
            packages/prisma/schema.prisma \
            packages/prisma/package.json

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "calcom-build.tar.gz"
          target: "/home/deploy/cal.com/"

      - name: Extract and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/cal.com
            tar -xzf calcom-build.tar.gz
            rm calcom-build.tar.gz
            corepack enable
            yarn config set nodeLinker node-modules
            # Install only production deps on the VPS
            yarn workspaces focus @calcom/web --production
            # Restart or start the app
            pm2 restart calcom || pm2 start "yarn workspace @calcom/web start" --name calcom
            pm2 save
